    <!-- Set the theme class before first paint, so a dark-mode visitor never sees a white flash.
         Must stay in sync with the KEY and initialTheme() in src/teas/theme.js. -->
    <script>
      try {
        var t = localStorage.getItem('teas-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.documentElement.style.colorScheme = t;
      } catch (e) { /* storage blocked, fall back to the light default */ }
    </script>
