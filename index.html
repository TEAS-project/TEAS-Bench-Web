<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TEAS reports measured cost, accuracy, performance and energy for LLM inference across models, workloads, engines and accelerators." />
    <link rel="canonical" href="https://www.teasbench.com/" />
    <title>TEAS Benchmark</title>
    <!-- Set the theme class before first paint, so a dark-mode visitor never sees a white flash.
         Must stay in sync with the KEY and initialTheme() in src/teas/theme.js. -->
    <script>
      try {
        var t = localStorage.getItem('teas-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.documentElement.style.colorScheme = t;
      } catch (e) { /* storage blocked, fall back to the light default */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
